# Animation for push-model.svg - regenerate with:
#   python3 scripts/animate-svg.py content/GitOpsCollection/images/ep-19/sources/push-model.anim.yaml
source: push-model.svg
output: ../push-model-animated.svg

# All dots share one trip duration so the chain stays in phase while looping.
dots:
  # ACM side: Placement -> PlacementDecision -> GitOpsCluster -> cluster secret -> Argo CD
  - { along: flow-placement-decision,     at: 0.0, dur: 1.4, color: "#0F766E" }
  - { along: flow-decision-gitopscluster, at: 0.4, dur: 1.4, color: "#0F766E" }
  - { along: flow-gitopscluster-secret,   at: 0.8, dur: 1.4, color: "#0F766E" }
  - { along: flow-secret-controller,      at: 1.2, dur: 1.4, color: "#0F766E" }
  - { along: flow-decision-appset,        at: 0.4, dur: 1.4, color: "#0F766E" }
  # Argo CD side: ApplicationSet -> Application -> controller -> spoke API -> resources
  - { along: flow-appset-application,     at: 1.2, dur: 1.4, color: "#C2410C" }
  - { along: flow-application-controller, at: 1.6, dur: 1.4, color: "#C2410C" }
  - { along: flow-controller-proxy,       at: 2.0, dur: 1.4, color: "#C2410C" }
  - { along: flow-proxy-apiserver,        at: 2.4, dur: 1.4, color: "#C2410C" }
  - { along: flow-apiserver-resources,    at: 2.8, dur: 1.4, color: "#C2410C" }
  # The tunnel is opened by the managed cluster (spoke -> hub); the fallback path stays static
  - { along: tunnel-spoke-hub,            at: 0.0, dur: 1.4, color: "#4B5563", radius: 3.5, below: bg-tunnel-label }
