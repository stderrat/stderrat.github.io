# Animation for pull-model.svg - regenerate with:
#   python3 scripts/animate-svg.py content/GitOpsCollection/images/ep-19/sources/pull-model.anim.yaml
source: pull-model.svg
output: ../pull-model-animated.svg

# All dots share one trip duration so the chain stays in phase while looping.
dots:
  # ACM side: Placement -> PlacementDecision -> ApplicationSet
  - { along: flow-placement-decision,        at: 0.0, dur: 1.4, color: "#0F766E" }
  - { along: flow-decision-appset,           at: 0.4, dur: 1.4, color: "#0F766E" }
  # Delivery: ApplicationSet -> Application -> propagation controller -> ManifestWork -> spoke
  - { along: flow-appset-application,        at: 0.8, dur: 1.4, color: "#C2410C" }
  - { along: flow-application-propagation,   at: 1.2, dur: 1.4, color: "#C2410C" }
  - { along: flow-propagation-manifestwork,  at: 1.6, dur: 1.4, color: "#0F766E" }
  - { along: flow-manifestwork-agent,        at: 2.0, dur: 1.4, color: "#C2410C" }
  - { along: flow-agent-app,                 at: 2.4, dur: 1.4, color: "#C2410C" }
  - { along: flow-app-argo,                  at: 2.8, dur: 1.4, color: "#C2410C" }
  - { along: flow-argo-resources,            at: 3.2, dur: 1.4, color: "#C2410C" }
  # The connection is opened by the managed cluster (klusterlet pulls)
  - { along: pull-spoke-hub,                 at: 0.0, dur: 1.4, color: "#4B5563", radius: 3.5, below: bg-pull-label }
  # Status back to the hub: ManifestWork status and ACM search -> aggregation -> report
  - { along: status-manifestwork,            at: 3.6, dur: 1.4, color: "#0F766E", radius: 3.5 }
  - { along: status-search,                  at: 3.6, dur: 1.4, color: "#0F766E", radius: 3.5 }
  - { along: status-sync-aggregation,        at: 4.0, dur: 1.4, color: "#0F766E", radius: 3.5 }
  - { along: status-aggregation-report,      at: 4.4, dur: 1.4, color: "#0F766E", radius: 3.5 }
