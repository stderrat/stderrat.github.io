# Animation for prerequisites-objects.svg - regenerate with:
#   python3 scripts/animate-svg.py content/GitOpsCollection/images/ep-19/sources/prerequisites-objects.anim.yaml
source: prerequisites-objects.svg
output: ../prerequisites-objects-animated.svg

# Flow dots along existing arrows (Inkscape path IDs). They start when the
# diagram scrolls into view and loop. "at" = delay in seconds, "dur" = one trip.
dots:
  - { along: path15, at: 0.0, dur: 1.2, color: "#0F766E" }                 # bm joins the set
  - { along: path16, at: 0.6, dur: 1.2, color: "#0F766E" }                 # sno joins the set
  - { along: path36, at: 0.3, dur: 2.4, color: "#0F766E", below: rect36 }  # binding -> set

# Optional: blocks that build up one after another (omit = always visible).
# stages:
#   - { at: 0.3, ids: [rect4, text4, text5] }
#   - { at: 1.3, ids: [rect10, text12, text13, text14, text15] }
