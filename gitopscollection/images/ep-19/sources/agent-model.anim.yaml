# Animation for agent-model.svg - regenerate with:
#   python3 scripts/animate-svg.py content/GitOpsCollection/images/ep-19/sources/agent-model.anim.yaml
source: agent-model.svg
output: ../agent-model-animated.svg

# All dots share one trip duration so the chain stays in phase while looping.
dots:
  # Setup (ACM): Placement -> GitOpsCluster -> add-on resources -> gitops-addon -> agent
  - { along: flow-placement-gitopscluster, at: 0.0, dur: 1.4, color: "#0F766E" }
  - { along: flow-gitopscluster-addon,     at: 0.4, dur: 1.4, color: "#0F766E" }
  - { along: flow-addon-gitopsaddon,       at: 0.8, dur: 1.4, color: "#0F766E" }
  - { along: flow-gitopsaddon-agent,       at: 1.2, dur: 1.4, color: "#4B5563", radius: 3.5 }
  - { along: flow-placement-appset,        at: 0.4, dur: 1.4, color: "#0F766E" }
  # The connection is opened by the agent (spoke -> hub)
  - { along: conn-agent-principal,         at: 0.0, dur: 1.4, color: "#4B5563", radius: 3.5 }
  # Delivery: ApplicationSet -> Applications -> principal -> agent -> local components -> resources
  - { along: flow-appset-applications,     at: 0.8, dur: 1.4, color: "#C2410C" }
  - { along: flow-applications-principal,  at: 1.2, dur: 1.4, color: "#C2410C" }
  - { along: flow-principal-agent,         at: 1.6, dur: 1.4, color: "#C2410C", below: bg-conn-label }
  - { along: flow-agent-local,             at: 2.0, dur: 1.4, color: "#C2410C" }
  - { along: flow-local-resources,         at: 2.4, dur: 1.4, color: "#C2410C" }
  # Full status back to the principal, shown in the hub UI
  - { along: status-agent-principal,       at: 2.8, dur: 1.4, color: "#0F766E", radius: 3.5 }
  - { along: flow-principal-ui,            at: 3.2, dur: 1.4, color: "#C2410C" }
